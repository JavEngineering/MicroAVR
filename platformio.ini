; MicroAVR PlatformIO Configuration
; Run with: pio run -e blink

; Project-level settings
[platformio]
src_dir = .

; ============================================
; Common configuration (DRY)
; ============================================
[common]
platform = atmelavr
board = nanoatmega328new
framework =
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L
build_flags =
    -std=c11
    -Os
    -Wall
    -Wextra
    -Wpedantic
    -ffunction-sections
    -fdata-sections
    -Iinclude
upload_port = COM4
upload_speed = 115200
build_unflags =
    -flto

; ============================================
; Example environments
; ============================================
[env:blink]
extends = common
build_src_filter = +<examples/blink/> +<src/gpio/> +<src/delay/>

[env:adc_example]
extends = common
build_src_filter = +<examples/adc/> +<src/gpio/> +<src/delay/> +<src/adc/>

[env:pwm_example]
extends = common
build_src_filter = +<examples/pwm/> +<src/gpio/> +<src/delay/> +<src/pwm/>

[env:timer_example]
extends = common
build_src_filter = +<examples/timer/> +<src/gpio/> +<src/delay/> +<src/timer/>

[env:uart_example]
extends = common
build_src_filter = +<examples/uart/> +<src/gpio/> +<src/delay/> +<src/uart/>

[env:spi_example]
extends = common
build_src_filter = +<examples/spi/> +<src/gpio/> +<src/delay/> +<src/spi/>

[env:i2c_example]
extends = common
build_src_filter = +<examples/i2c/> +<src/gpio/> +<src/delay/> +<src/i2c/>

[env:interrupt_example]
extends = common
build_src_filter = +<examples/interrupt/> +<src/gpio/> +<src/delay/> +<src/interrupt/>

[env:sleep_example]
extends = common
build_src_filter = +<examples/sleep/> +<src/gpio/> +<src/delay/> +<src/sleep/> +<src/power/>

[env:wdt_example]
extends = common
build_src_filter = +<examples/wdt/> +<src/gpio/> +<src/delay/> +<src/wdt/>

[env:eeprom_example]
extends = common
build_src_filter = +<examples/eeprom/> +<src/gpio/> +<src/delay/> +<src/eeprom/> +<src/uart/>

; ============================================
; Benchmark environments
; ============================================
[env:bench_arduino]
extends = common
framework = arduino
build_src_filter = +<benchmarks/arduino/>

[env:bench_microavr]
extends = common
build_src_filter = +<benchmarks/microavr/> +<src/gpio/> +<src/delay/> +<src/adc/> +<src/pwm/> +<src/timer/> +<src/uart/> +<src/spi/> +<src/i2c/> +<src/interrupt/>

[env:bench_bare]
extends = common
build_src_filter = +<benchmarks/bare_avr/>